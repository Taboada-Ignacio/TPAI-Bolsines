services:
  backend:
    build: &app-build .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: &database-url ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-bolsines}:${POSTGRES_PASSWORD:-bolsines_dev}@postgres:5432/${POSTGRES_DB:-bolsines}}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:-}
      GPS_SIMULADOR_API_KEY: ${GPS_SIMULADOR_API_KEY:-simulador-local}
      GPS_SIMULADOR_BASE_URL: ${GPS_SIMULADOR_BASE_URL:-http://127.0.0.1:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-notificaciones@bolsines.test}
    depends_on:
      migrate:
        condition: service_completed_successfully
        restart: true
    develop:
      watch:
        - path: ./src
          action: sync
          target: /app/src
          initial_sync: true
        - path: ./prisma
          action: rebuild
          ignore:
            - generated/
        - path: ./prisma.config.ts
          action: rebuild
        - path: ./package.json
          action: rebuild
        - path: ./package-lock.json
          action: rebuild

  migrate:
    build: *app-build
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["node", "prisma/seeds/run-init.mjs"]

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"

  postgres:
    image: postgres:17.12-bookworm
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bolsines}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bolsines_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bolsines}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
